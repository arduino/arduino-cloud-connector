name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  GITHUB_TOKEN: ${{ secrets.ARDUINOBOT_TOKEN }}
  GITHUB_USERNAME: ArduinoBot

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Set version from tag
        run: echo "TAG_VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Configure Git for private repo access
        run: |
          git config --global url."https://${{ env.GITHUB_USERNAME }}:${{ env.GITHUB_TOKEN }}@github.com".insteadOf "https://github.com"

      - name: Build .deb
        run: go tool task build-deb VERSION=${{ env.TAG_VERSION }} ARCH=${{ matrix.arch }} RELEASE=true

      - name: Upload .deb to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: true
          artifacts: build/*.deb
          allowUpdates: true
