name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: --timeout 300s

      - name: Check go mod is tidy
        run: |
          go mod tidy
          git diff --color --exit-code

      # The E2E harness is a separate module with its own .golangci.yml, and
      # the rule that matters lives there: a default-deny depguard that stops
      # the harness importing the daemon's packages instead of reimplementing
      # the wire formats it checks. An unlinted harness is an unenforced rule.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          args: --timeout 300s
          working-directory: test/e2e

      - name: Check E2E harness go mod is tidy
        working-directory: test/e2e
        run: |
          go mod tidy
          git diff --color --exit-code
