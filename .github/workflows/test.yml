name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

      # The E2E harness is a separate Go module, so the command above does not
      # reach it. These are the harness's own unit tests -- what keeps the thing
      # that judges the daemon honest -- and they spawn no daemon, so they
      # belong on every PR. -short is what leaves out the scenario driver: that
      # one spawns the binary and runs in the E2E workflow.
      - name: Run E2E harness unit tests
        working-directory: test/e2e
        run: go test -short -race ./...

