name: E2E

# Runs the black-box scenarios under test/e2e: the harness stands up a fake
# Provisioning API, a connectivity probe and an MQTT broker with mutual TLS,
# spawns the real daemon binary against all three, and asserts on what crosses
# those boundaries.
#
# It is a job of its own rather than a step in Test because it spawns a daemon
# and binds four listeners, which is minutes rather than seconds. The harness's
# own unit tests spawn nothing and run in Test on every PR.
#
# DELIBERATELY NOT A REQUIRED CHECK yet. A failure here shows up red on the pull
# request but does not block the merge, and it should stay that way until the
# suite has a stability record: a new E2E gate that blocks merges from day one
# is a gate somebody disables. Add it to the branch protection rules once it has
# been green for a few weeks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scenarios:
    name: E2E scenarios
    runs-on: ubuntu-latest
    # Every expectation in a scenario carries its own timeout, so a scenario
    # bounds itself. This is the backstop for what those cannot bound: a hang
    # before the first scenario starts, or an action wedged on a socket.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod

      # Built through the task so the binary under test is the same one a
      # developer builds locally. The `mock` build tag is not optional: it is
      # what makes the UHWID readable off a board and DeviceNetConfig
      # deterministic, without which the handshake the scenarios assert on does
      # not happen on a runner at all.
      - name: Build the daemon under test
        run: |
          go tool \
            github.com/go-task/task/v3/cmd/task \
              build:mock

      - name: Build the E2E tool
        run: |
          go tool \
            github.com/go-task/task/v3/cmd/task \
              build-e2e

      # The tool, not `go test`: this job exists to run the scenarios, and the
      # tool's output IS the verdict -- a PASS line per scenario, the full
      # report on a failure, and a non-zero exit when any scenario failed.
      # Running the module's tests here instead would bury that under the
      # harness's own unit tests, whose formatter cases deliberately print
      # example FAILED reports -- indistinguishable, in a log, from a real one.
      # Those unit tests belong to the Test workflow, which runs them with
      # -race on every PR.
      #
      # The daemon is configured by the harness, not from here: World.Env()
      # builds MQTT_BROKER, MQTT_CA_FILE, PROVISIONING_API and NTP_PROBE_HOST
      # from the ports the kernel assigns at startup, and daemonproc passes
      # them to the child. -daemon is only which binary to drive.
      - name: Run the scenarios
        working-directory: test/e2e
        run: ../../build/arduino-cloud-connector-e2e -daemon ../../build/arduino-cloud-connector-mock

      # Uploaded on every outcome, not only on a failure. _artifacts/<scenario>.txt
      # places a failed expectation at the instant it was waiting, prints which
      # fields differed and interleaves every source on one timeline; the .json
      # beside it is the same run as data. On a green run that timeline is the
      # only record of what the daemon actually did -- discarding it is how a
      # suite becomes a boolean, and it is also what you diff against when the
      # next run goes red for no apparent reason.
      #
      # `if: always()` rather than no condition at all: a step with no condition
      # is skipped once an earlier one fails, which would drop the artifact in
      # the only case it was originally kept for.
      - name: Upload the timelines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timelines
          path: test/e2e/_artifacts/
          # A build failure means there is no run to upload, and that is not
          # itself an error worth a second red step.
          if-no-files-found: ignore
